- hosts: all
  become: yes
  gather_facts: no

  # This playbook applies user_data in a limited scope without re-running
  # cloud-init init/network stages, so NetworkUpdate-assigned static IPs are
  # not reset.
  #
  # Required variable:
  #   user_data: base64-encoded cloud-config content to apply.

  tasks:
    # Persist decoded user_data temporarily for asynchronous runner usage.
    - name: Write decoded user_data to temporary file
      copy:
        content: "{{ user_data | b64decode }}"
        dest: /var/tmp/networkupdate-user-data.yaml
        mode: '0600'

    # Runner script tracks progress in /run/maas/user-data-apply.status.
    # Status values: running, done, failed.
    - name: Install user_data apply runner
      copy:
        content: |
          #!/bin/bash
          set -euo pipefail

          STATUS_DIR="/run/maas"
          STATUS_FILE="${STATUS_DIR}/user-data-apply.status"
          USER_DATA_TMP="/var/tmp/networkupdate-user-data.yaml"

          # cloud-init single reads module config from the instance cache, NOT from
          # /etc/cloud/cloud.cfg.d/. We must overwrite the cache so the new user_data
          # is used instead of the original deployment user_data.
          CLOUD_INSTANCE_DIR="/var/lib/cloud/instance"

          mkdir -p "${STATUS_DIR}"
          echo "running" > "${STATUS_FILE}"

          finish() {
            rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "done" > "${STATUS_FILE}"
            else
              echo "failed" > "${STATUS_FILE}"
            fi
            exit $rc
          }
          trap finish EXIT

          # Update cloud-init instance cache with new user_data.
          cp "${USER_DATA_TMP}" "${CLOUD_INSTANCE_DIR}/user-data.txt"
          cp "${USER_DATA_TMP}" "${CLOUD_INSTANCE_DIR}/cloud-config.txt"

          # Run only requested cloud-init modules and avoid init/network stages.
          cloud-init single --name cc_write_files --frequency always
          cloud-init single --name cc_runcmd --frequency always
          cloud-init single --name cc_scripts_user --frequency always

          rm -f "${USER_DATA_TMP}"
        dest: /var/tmp/run-user-data-apply.sh
        mode: '0755'

    - name: Ensure status directory exists
      file:
        path: /run/maas
        state: directory
        mode: '0755'

    - name: Mark apply status as queued
      copy:
        content: "queued\n"
        dest: /run/maas/user-data-apply.status
        mode: '0644'

    - name: Stop previous user_data apply unit if running
      command: systemctl stop cloud-init-user-data-apply.service
      failed_when: false
      changed_when: false

    - name: Reset previous user_data apply unit failed state
      command: systemctl reset-failed cloud-init-user-data-apply.service
      failed_when: false
      changed_when: false

    # Execute asynchronously so NetworkUpdate can return ACCEPT quickly.
    - name: Launch user_data apply asynchronously via systemd-run
      shell: systemd-run --unit=cloud-init-user-data-apply /var/tmp/run-user-data-apply.sh
      changed_when: true
