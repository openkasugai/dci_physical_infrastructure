- hosts: all
  become: no

  tasks:
    - name: helth check cmd
      shell: "/opt/epc/bin/hhchk -F '{{ cdi_pass }}' -D '{{ director_pass}}'"
      args:
        chdir: /home/cdiadmin
      register: hhchk_result

    - name: result output
      debug:
        msg: "{{ hhchk_result.stdout_lines }}"
