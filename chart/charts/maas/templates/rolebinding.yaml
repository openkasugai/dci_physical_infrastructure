apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mychart.childName" (dict "Release" .Release "childChartName" "maas") }}-job-manager
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mychart.childName" (dict "Release" .Release "childChartName" "maas") }}-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "mychart.childName" (dict "Release" .Release "childChartName" "maas") }}-job-manager
  apiGroup: rbac.authorization.k8s.io
