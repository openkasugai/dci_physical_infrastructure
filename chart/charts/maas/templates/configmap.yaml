apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mychart.childName" (dict "Release" .Release "childChartName" "maas") }}-config
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  MAAS_SERVER_PORT: {{ .Values.config.serverPort | quote }}
  VM_HOST_DISK: {{ .Values.config.vmHostDisk | quote }}
  LXD_PORT: {{ .Values.config.lxdListenPort | quote }}
  ANSIBLE_PATH: {{ .Values.config.ansiblePath | quote }}
  SSH_KEY: {{ .Values.config.sshPrivateKeyPath | quote }}
  TLS_ENABLE: {{ .Values.tls.enabled | quote }}
  TLS_CERT_PATH: {{ .Values.tls.certPath | quote }}
  K8S_JOB_WORKER_IMAGE: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  K8S_JOB_SERVICE_ACCOUNT: {{ printf "%s-sa" (include "mychart.childName" (dict "Release" .Release "childChartName" "maas")) | quote }}
  K8S_JOB_SSH_SECRET_NAME: {{ .Values.ssh.secretName | quote }}
  K8S_JOB_TLS_SECRET_NAME: {{ .Values.tls.secretName | quote }}
  K8S_JOB_BACKOFF_LIMIT: "0"
  K8S_JOB_TTL_SECONDS: "600"
  K8S_JOB_ACTIVE_DEADLINE_SECONDS: "7200"
  MAAS_API_RETRY_COUNT: {{ .Values.config.maasApiRetryCount | quote }}
  MAAS_API_RETRY_INTERVAL_SECONDS: {{ .Values.config.maasApiRetryIntervalSeconds | quote }}
